/* ===== iOS 27 inspired Liquid Glass refresh ===== */
body{font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","SF Pro Text",system-ui,"Segoe UI",Tahoma,sans-serif;letter-spacing:-.005em}
.wrap{padding:0 14px 140px}
header{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);margin:8px 0 6px;padding:8px 10px 8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.34);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1.5px 0 rgba(255,255,255,.65);-webkit-backdrop-filter:blur(40px) saturate(210%);backdrop-filter:blur(40px) saturate(210%)}

#ed{border-radius:999px;padding:7px 16px;font-weight:700;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.25)}

.lead{margin:-4px 4px 14px;color:var(--mute);font-size:.9rem}
.tw,.pl,.org,.ef,.empty,.kp div,.ac,.txt,.spc{border-radius:30px}

.wk+.row.mt,.row.mt:first-of-type{border-radius:28px 28px 0 0}.row.mt:last-child{border-radius:0 0 28px 28px}.row.bp{border-radius:28px}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;height:70px;padding:6px;gap:2px;justify-content:space-between;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.09));border:1px solid rgba(255,255,255,.38);box-shadow:0 20px 56px rgba(0,0,0,.55),inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(44px) saturate(220%);backdrop-filter:blur(44px) saturate(220%)}

nav svg{width:25px;height:25px;stroke-width:1.7}
nav button[aria-selected=true]{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.14))!important;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),0 6px 20px rgba(0,0,0,.35)!important;color:#fff;font-weight:700}
nav button[aria-selected=true] span{color:#7df5bd!important;filter:drop-shadow(0 0 8px rgba(80,240,170,.7))}
.seg{border-radius:999px;padding:4px;margin:0 0 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:inset 0 2px 5px rgba(0,0,0,.25)}

.btn{border-radius:999px;padding:10px 20px}
input,select,textarea{border-radius:16px;background:rgba(255,255,255,.14);color:var(--ink);border:1px solid rgba(255,255,255,.2)}
textarea{font:inherit;font-size:.9rem;width:100%;padding:9px;line-height:1.8;resize:vertical;min-width:0}
.spc{padding:18px 16px;margin-bottom:14px}

#wmk{margin-inline-start:auto;height:42px;width:auto;filter:drop-shadow(0 0 5px rgba(255,255,255,.6)) drop-shadow(0 2px 6px rgba(0,0,0,.4))}

header h1{font-size:.9rem}
nav button{font-size:.6rem}nav svg{width:22px;height:22px}
#sheet{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;visibility:hidden;transition:visibility 0s .4s}
#sheet.on{pointer-events:auto;visibility:visible;transition:none}
.sbk{position:absolute;inset:0;background:rgba(2,8,30,.55);opacity:0;transition:opacity .35s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}#sheet.on .sbk{opacity:1}
.spn{position:relative;width:100%;max-width:560px;margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));padding:10px 18px 18px;border-radius:36px;color:var(--ink);background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.14));border:1px solid rgba(255,255,255,.42);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.8);-webkit-backdrop-filter:blur(50px) saturate(220%);backdrop-filter:blur(50px) saturate(220%);transform:translateY(115%);transition:transform .5s cubic-bezier(.2,1,.3,1)}
#sheet.on .spn{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.55);margin:0 auto 10px}
.spn h3{margin:4px 2px 10px;font-size:1.5rem}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.18)}
.srow b{display:block}.srow small{display:block;color:var(--mute);font-size:.74rem;line-height:1.5}
.sw{width:56px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.2);position:relative;padding:0;flex:none;transition:background .25s}
.sw i{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:right .25s,left .25s}
.sw[aria-pressed=true]{background:linear-gradient(180deg,#46e6a0,#18b878)}.sw[aria-pressed=true] i{right:calc(100% - 29px)}
.pill{font:inherit;font-weight:700;padding:8px 20px;border-radius:999px;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.14));border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.sft{margin:14px 0 12px;text-align:center;color:var(--mute);font-size:.74rem;line-height:1.9}
.spn .btn{width:100%}
.pitchw{margin:0 0 12px}.pitch2{width:100%;display:block;border-radius:28px;box-shadow:0 16px 44px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.3)}
.chips.f button{width:auto;height:auto;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.95rem}
.spc.m{padding:14px 16px}.spc.m h3{margin:0 0 6px;font-size:1.15rem}.spc.m p{margin:0 0 8px;font-size:.9rem;line-height:1.9}
.spc.m ul{margin:0;padding:0 18px 0 0}.spc.m li{font-size:.88rem;line-height:1.9}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:6px}.mh h3{margin:0}.mh .lg-c{--s:44px}
.crit{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 12px}.crit span{font-size:.72rem;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.tr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.tr:last-child{border:0}
.tr .lg-c{--s:50px}.ph.s2{width:52px;height:52px;border-width:2px}
.tr .pn{flex:1;min-width:0}.tr .pn b{display:block;font-size:.95rem}.tr .pn small{color:var(--mute)}
.mt2{height:6px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}.mt2 i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#46e6a0,#f2b61c)}
.tst{display:flex;gap:10px}.tst span{text-align:center;font-weight:800;font-size:1rem;line-height:1.1}.tst small{display:block;font-size:.6rem;font-weight:400;color:var(--mute)}
.noanim .bg *,.noanim .bg{animation:none!important}.noanim .bg .b,.noanim .bg .roll,.noanim .bg .fl{display:none}
/* ===== day mode ===== */
html.day{background:#cfe6ff;color-scheme:light}
html.day:root:root:root{--ink:#0e1b40;--mute:#52618c;--surf:rgba(255,255,255,.6);--line:rgba(20,45,120,.14);--bg:rgba(255,255,255,.7);--gold:#c98a0b;--on:#fff;color-scheme:light}
html.day .bg{background:linear-gradient(180deg,#9fcdff 0%,#d4eaff 46%,#b4e4c2 100%)}
html.day .bg .fl,html.day .bg .crowd,html.day .bg .b,html.day .bg .roll{display:none}
html.day .bg .blob{opacity:.25}html.day .bg .wm{opacity:.16}html.day .bg .pitch{opacity:.5}
html.day .tw,html.day .pl,html.day .row,html.day .org,html.day .ef,html.day .empty,html.day .ac,html.day .txt,html.day .kp div,html.day .spc,html.day .seg,html.day .chips button,html.day header,html.day nav,html.day .spn{background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.5));border-color:rgba(255,255,255,.95);box-shadow:0 12px 34px rgba(40,70,150,.2),inset 0 1.5px 0 #fff}
html.day nav button{color:rgba(14,27,64,.7)}html.day nav button[aria-selected=true]{color:#0e1b40;background:linear-gradient(180deg,#fff,rgba(255,255,255,.55))!important}html.day nav button[aria-selected=true] span{color:#0b8f5a!important;filter:none}
html.day header h1,html.day #gear{color:#0e1b40}html.day #wmk{filter:drop-shadow(0 2px 5px rgba(0,0,0,.25))}
html.day .seg button[aria-selected=true]{color:#0e1b40;background:#fff}html.day .chips button[aria-selected=true]{color:#fff}
html.day td.pt{color:#0e1b40;background:rgba(20,45,120,.06)}html.day th{background:rgba(20,45,120,.06)}html.day tr:hover td{background:rgba(20,45,120,.05)}

html.day .pill{color:#0e1b40}html.day .hl{background:rgba(20,45,120,.06)}
html.day .sbk{background:rgba(180,210,255,.45)}html.day .grab{background:rgba(20,45,120,.25)}html.day .sw{background:rgba(20,45,120,.15)}

const FM={"4-4-2":{"t":"۴-۴-۲","d":"کلاسیک‌ترین سیستم فوتبال؛ دو خط چهارنفره فشرده و دو مهاجم. ساده، متوازن و آسان برای آموزش در تیم‌های باشگاهی.","st":["انسجام دفاعی و فاصله کم بین خطوط","دو مهاجم همیشه برای دفاع حریف تهدیدند","بازی از کناره‌ها با وینگرها"],"wk":["کمبود نفر در میانه برابر سه هافبک","وابستگی زیاد به کیفیت بازیکنان کناری"],"use":"تیم‌هایی که نظم دفاعی و ضدحمله سریع می‌خواهند.","tip":"با پرس هماهنگ دو مهاجم، خروج توپ حریف از عقب را سخت کنید.","p":[["GK",50,92],["LB",14,74],["CB",38,77],["CB",62,77],["RB",86,74],["LM",14,50],["CM",38,53],["CM",62,53],["RM",86,50],["ST",38,24],["ST",62,24]]},"4-3-3":{"t":"۴-۳-۳","d":"سه هافبک و سه مهاجم؛ پایه فوتبال هجومی و پرس بالا. وینگرها عرض زمین را باز می‌کنند و هافبک دفاعی محور تیم است.","st":["تسلط در میانه با ساختن مثلث‌های پاس","عرض‌دهی هجومی و پرس بالا","تبدیل آسان به ۴-۱-۴-۱ هنگام دفاع"],"wk":["فاصله زیاد بین خطوط اگر پرس هماهنگ نباشد","نیاز به فول‌بک‌های پرانرژی"],"use":"تیم‌هایی با وینگرهای سریع و هافبک‌های فنی.","tip":"هافبک دفاعی را مثل «نقطه اتصال» دفاع و میانه تمرین بدهید.","p":[["GK",50,92],["LB",14,74],["CB",38,77],["CB",62,77],["RB",86,74],["CM",28,52],["DM",50,60],["CM",72,52],["LW",16,28],["ST",50,20],["RW",84,28]]},"4-2-3-1":{"t":"۴-۲-۳-۱","d":"دو هافبک دفاعی، سه هافبک هجومی پشت یک مهاجم. تعادل مدرن بین دفاع و حمله.","st":["پوشش عالی جلوی خط دفاع","هافبک هجومی میانی خالق موقعیت است","در دفاع ۴-۴-۱-۱ و در حمله ۲-۳-۵"],"wk":["مهاجم تنها اگر حمایت نشود منزوی می‌شود","نیاز به شماره ۱۰ باکیفیت"],"use":"تیمی که هم توپ را می‌خواهد هم ثبات دفاعی.","tip":"مهاجم تنها باید نقش «نگه‌داشتن توپ» را تمرین کند تا همراهان برسند.","p":[["GK",50,92],["LB",14,74],["CB",38,77],["CB",62,77],["RB",86,74],["DM",36,58],["DM",64,58],["LW",16,40],["AM",50,38],["RW",84,40],["ST",50,20]]},"3-5-2":{"t":"۳-۵-۲","d":"سه مدافع میانی با دو وینگ‌بک و سه هافبک؛ برتری عددی در میانه و دو مهاجم.","st":["برتری عددی در مرکز زمین","وینگ‌بک‌ها هم حمله و هم دفاع را پوشش می‌دهند","دو مهاجم برای پرس و ضدحمله"],"wk":["پشت وینگ‌بک‌ها فضا باز می‌ماند","نیاز به دو وینگ‌بک با آمادگی بسیار بالا"],"use":"وقتی مدافع میانی خوب زیاد دارید و وینگ‌بک‌های پرانرژی.","tip":"به‌محض از دست رفتن توپ، وینگ‌بک را برگردانید تا پشت دفاع باز نماند.","p":[["GK",50,92],["CB",24,77],["CB",50,79],["CB",76,77],["LWB",10,52],["CM",32,50],["DM",50,61],["CM",68,50],["RWB",90,52],["ST",38,24],["ST",62,24]]},"3-4-3":{"t":"۳-۴-۳","d":"سیستم تهاجمی با سه مدافع، چهار هافبک و سه مهاجم؛ فشار دائمی روی دفاع حریف.","st":["سه مهاجم و فشار پیوسته","تسلط روی توپ و پرس بالا","ساخت بازی سه‌نفره از عقب"],"wk":["کم‌بودن مدافع در برابر ضدحمله","نیاز به آمادگی بدنی بسیار بالا"],"use":"تیمی که توپ را خوب نگه می‌دارد و بازیکنان فنی دارد.","tip":"سه مدافع باید جاگیری مشترک و خط دفاعی بالا را با هم تمرین کنند.","p":[["GK",50,92],["CB",24,77],["CB",50,79],["CB",76,77],["LM",12,54],["CM",38,54],["CM",62,54],["RM",88,54],["LW",20,26],["ST",50,20],["RW",80,26]]},"5-3-2":{"t":"۵-۳-۲","d":"پنج‌نفره دفاعی با وینگ‌بک‌ها و سه هافبک؛ سیستم ایمن برای بازی‌های سخت.","st":["بسیار محکم در دفاع","کنترل فضاهای بین خطوط","ضدحمله خطرناک با دو مهاجم"],"wk":["ریسک عقب‌نشینی بیش از حد","خلاقیت کم در مرکز"],"use":"مقابل تیم‌های قوی‌تر یا برای حفظ نتیجه.","tip":"وقتی توپ دارید، وینگ‌بک‌ها را بالا ببرید تا ۵-۳-۲ به ۳-۵-۲ تبدیل شود.","p":[["GK",50,92],["LWB",8,62],["CB",28,77],["CB",50,79],["CB",72,77],["RWB",92,62],["CM",28,50],["CM",50,52],["CM",72,50],["ST",38,24],["ST",62,24]]},"4-1-4-1":{"t":"۴-۱-۴-۱","d":"یک هافبک دفاعی جلوی دفاع، چهار هافبک در یک خط و یک مهاجم؛ بلوک فشرده و منظم.","st":["فشردگی عالی در میانه","هافبک دفاعی ضدحمله حریف را می‌برد","تغییر آسان به ۴-۳-۳ در حمله"],"wk":["مهاجم تنها","اگر هافبک‌ها بالا نروند، حمله کم‌خطر می‌شود"],"use":"تیمی که بلوک میانی مرتب و ضدحمله سریع می‌خواهد.","tip":"هافبک‌های بیرونی باید بعد از گرفتن توپ سریع جلو بروند و مهاجم را همراهی کنند.","p":[["GK",50,92],["LB",14,74],["CB",38,77],["CB",62,77],["RB",86,74],["DM",50,60],["LM",14,44],["CM",38,44],["CM",62,44],["RM",86,44],["ST",50,20]]}};
const MOD=[{"t":"پرس بالا و ضدپرس (Gegenpressing)","d":"به‌محض از دست رفتن توپ، چند ثانیه فشار شدید برای پس‌گرفتن آن در همان منطقه. توپ نزدیک دروازه حریف پس گرفته می‌شود و فرصت گل می‌سازد.","tip":"بعد از از دست رفتن توپ، نزدیک‌ترین سه نفر به توپ فشار می‌آورند و بقیه مسیر پاس را می‌بندند."},{"t":"ساخت بازی از عقب (Build-up)","d":"دروازه‌بان و مدافعان با پاس کوتاه توپ را از خط اول پرس عبور می‌دهند. هدف ساختن مثلث و پیدا کردن «مرد آزاد» است.","tip":"دو مدافع میانی را عریض بگذارید و هافبک دفاعی را بین آن‌ها پایین بیاورید."},{"t":"بازی موقعیتی (Positional Play)","d":"زمین به منطقه‌ها تقسیم می‌شود و هر بازیکن با جاگیری درست، برتری عددی یا کیفی می‌سازد. بازیکن بدون توپ هم تصمیم می‌گیرد.","tip":"در تمرین، قانون «هر پاس یک مرد آزاد می‌سازد» را اجرا کنید."},{"t":"نیم‌فضاها (Half-spaces)","d":"کانال‌های بین کنار و مرکز زمین. بازیکن در این فضا بین خط‌های حریف می‌ایستد و مدافع نمی‌داند چه کسی را بگیرد.","tip":"هافبک هجومی را در نیم‌فضا بگذارید و وینگر را عریض نگه دارید."},{"t":"انتقال‌ها (Transitions)","d":"پنج ثانیه بعد از گرفتن یا از دست دادن توپ. بخش مهمی از گل‌ها در همین لحظه‌ها زده می‌شود.","tip":"با تمرین «۶ نفر در برابر ۴ نفر» ضدحمله سریع را تمرین کنید."},{"t":"بلوک دفاعی (بالا، میانی، پایین)","d":"ارتفاع خط دفاع و فاصله بین خطوط. بلوک بالا توپ را زود می‌گیرد، بلوک پایین فضا را می‌بندد.","tip":"فاصله بین دفاع و حمله را حداکثر ۳۵ متر نگه دارید تا تیم فشرده بماند."},{"t":"نقش‌های ترکیبی","d":"فول‌بک وارونه به میانه می‌آید و مهاجم کاذب عقب می‌رود تا مدافع را از جایش بکشد. بازیکنان چندکاره، سیستم را در حین بازی عوض می‌کنند.","tip":"به هر بازیکن دو نقش یاد بدهید تا مربی بتواند ساختار را عوض کند."},{"t":"توپ‌های ثابت","d":"کرنر، ضربه آزاد و پرتاب اوت با طرح‌های تمرین‌شده؛ بخش مهمی از گل‌های هر دوره از همین‌هاست.","tip":"سه طرح کرنر و دو طرح ضربه آزاد ثابت داشته باشید و بارها تمرین کنید."},{"t":"دروازه‌بان به‌عنوان بازیکن میدان","d":"دروازه‌بان مدرن با پا بازی می‌کند، در ساخت بازی شرکت دارد و پشت خط دفاعی بالا را پوشش می‌دهد.","tip":"تمرین پاس بلند و کوتاه با پا را در برنامه دروازه‌بان بگذارید."},{"t":"تحلیل داده و ویدیو","d":"شمارش گل، پاس گل، کارت و نقشه عملکرد بازیکن‌ها؛ تحلیل ویدیویی نقاط ضعف و قوت را نشان می‌دهد. همین بخش آمار اپ شروع این مسیر است.","tip":"بعد از هر بازی ده دقیقه آمار و ویدیوی بازی را با بازیکنان مرور کنید."},{"t":"آمادگی بدنی و پیشگیری از مصدومیت","d":"دوره‌بندی تمرین، کنترل بار تمرینی و ریکاوری باعث می‌شود بازیکنان در ۹۰ دقیقه افت نکنند و کمتر مصدوم شوند.","tip":"یک روز قبل و بعد از بازی، تمرین سبک و کششی بگذارید."},{"t":"روان‌شناسی و رهبری","d":"انگیزه، اعتماد به نفس، سخنرانی نیمه‌وقت و فرهنگ تیم همان‌قدر مهم‌اند که تاکتیک. کاپیتان واسطه مربی در زمین است.","tip":"به‌جای سرزنش، بعد از اشتباه بازیکن راه‌حل را با او مرور کنید."}];
const SES=["گرم کردن و فعال‌سازی (۱۰ دقیقه)", "بازی‌های کوچک ۴ در ۴ یا ۵ در ۵ (۲۰ دقیقه)", "تمرین تکنیک زیر فشار (۱۵ دقیقه)", "بازی شرایطی مطابق سیستم بازی (۲۵ دقیقه)", "سرد کردن و بازخورد (۱۰ دقیقه)"];
let cfm="4-3-3",cm="sys";
function pitch(k){const d=FM[k];let b="";for(let i=0;i<8;i++)b+=`<rect x="1" y="${1+i*15.25}" width="98" height="15.25" fill="rgba(255,255,255,${i%2?.05:0})"/>`;
 return `<svg class="pitch2" viewBox="0 0 100 124"><defs><linearGradient id="pgx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23a15d"/><stop offset="1" stop-color="#0f6a3a"/></linearGradient></defs><rect x="1" y="1" width="98" height="122" rx="5" fill="url(#pgx)"/>${b}<g fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".5"><rect x="1" y="1" width="98" height="122" rx="5"/><path d="M1 62H99"/><circle cx="50" cy="62" r="10"/><rect x="24" y="1" width="52" height="19"/><rect x="38" y="1" width="24" height="7"/><rect x="24" y="104" width="52" height="19"/><rect x="38" y="116" width="24" height="7"/></g>${d.p.map((q,i)=>{const x=q[1],y=q[2]*1.2;return `<g><circle cx="${x}" cy="${y}" r="5" fill="${i==0?"#f2b61c":"#fff"}" fill-opacity=".95" stroke="rgba(10,30,100,.55)" stroke-width=".6"/><text x="${x}" y="${y+1.6}" text-anchor="middle" font-size="4.6" font-weight="800" fill="#0a1a5a">${i+1}</text><text x="${x}" y="${y+9}" text-anchor="middle" font-size="3" font-weight="700" fill="#fff" stroke="rgba(0,40,20,.6)" stroke-width=".5" paint-order="stroke">${q[0]}</text></g>`}).join("")}</svg>`}
function coachView(){const seg=`<div class="seg">${[["sys","سیستم‌های فوتبال"],["mod","مربی‌گری مدرن"]].map(x=>`<button data-cm="${x[0]}" aria-selected="${cm==x[0]}">${x[1]}</button>`).join("")}</div>`;
 if(cm=="mod")return `<h2>مربی‌گری مدرن</h2><p class="lead">مفاهیمی که فوتبال امروز را می‌سازند، با نکته‌ای برای مربی.</p>${seg}`+MOD.map((m,i)=>`<article class="spc m"><div class="mh"><span class="rk">${f(i+1)}</span><h3>${esc(m.t)}</h3></div><p>${esc(m.d)}</p><div class="hl">نکته مربی: ${esc(m.tip)}</div></article>`).join("")+`<article class="spc m"><h3>الگوی یک جلسه تمرین مدرن</h3><ol class="tl">${SES.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></article>`;
 const d=FM[cfm];return `<h2>سیستم‌های فوتبال</h2><p class="lead">یک سیستم را انتخاب کنید تا چیدمان و توضیح مربی را ببینید.</p>${seg}<div class="chips f">${Object.keys(FM).map(k=>`<button data-cf="${k}" aria-selected="${k==cfm}">${FM[k].t}</button>`).join("")}</div><div class="pitchw">${pitch(cfm)}</div><article class="spc m"><h3>${d.t}</h3><p>${esc(d.d)}</p><h4>نقاط قوت</h4><ul>${d.st.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h4>نقاط ضعف</h4><ul>${d.wk.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h4>مناسب برای</h4><p>${esc(d.use)}</p><div class="hl">نکته مربی: ${esc(d.tip)}</div></article>`}
function talView(){const mo={};BEST.forEach(b=>{const i=b.n+"|"+b.t;mo[i]=(mo[i]||0)+1});const cd={};cplist().forEach(c=>{cd[c.n+"|"+c.t]=c});
 const rows=plist().map(p=>{const i=p.n+"|"+p.t,c=cd[i]||{y:0,r:0},m=mo[i]||0;return {n:p.n,t:p.t,g:p.g,a:p.a,m,sc:p.g*3+p.a*2+m*4-c.r*2-c.y*.5}});
 BEST.forEach(b=>{if(!rows.some(r=>r.n==b.n&&r.t==b.t)){const m=mo[b.n+"|"+b.t];rows.push({n:b.n,t:b.t,g:0,a:0,m,sc:m*4})}});
 rows.sort((a,b)=>b.sc-a.sc);const top=rows.slice(0,10),mx=top.length?Math.max(1,top[0].sc):1;
 const ph=(n,t)=>{const b=BEST.find(x=>x.n==n&&x.t==t);return b?`<img class="ph s2" src="${IM.best[b.p]}" alt="">`:tlg(t)};
 let h=`<h2>استعدادها</h2><p class="lead">ستاره‌های در حال ظهور جام، بر اساس عملکرد در میدان.</p><div class="crit"><span>گل ×۳</span><span>پاس گل ×۲</span><span>بهترین بازیکن ×۴</span><span>کارت قرمز −۲</span><span>کارت زرد −۰٫۵</span></div>`;
 h+=top.length?`<div class="pl">${top.map((x,i)=>`<div class="tr"><span class="rk">${f(i+1)}</span>${ph(x.n,x.t)}<div class="pn"><b>${esc(x.n)}</b><small>${esc(x.t)}</small><div class="mt2"><i style="width:${Math.max(6,Math.round(Math.max(0,x.sc)/mx*100))}%"></i></div></div><div class="tst"><span>${f(x.g)}<small>گل</small></span><span>${f(x.a)}<small>پاس</small></span><span>${f(x.m)}<small>★</small></span></div></div>`).join("")}</div>`:`<div class="empty">هنوز آماری ثبت نشده است.</div>`;
 h+=`<h2>گزارش استعدادیابی</h2>`;
 h+=S.talents.length?S.talents.map(x=>`<article class="spc m"><div class="mh">${tlg(x.t)}<div><h3>${esc(x.n||"بدون نام")}</h3><div class="mu">${esc(x.t)}${x.pos?" · "+esc(x.pos):""}</div></div></div>${x.note?`<p>${esc(x.note)}</p>`:""}</article>`).join(""):`<div class="empty">هنوز گزارشی ثبت نشده است. در حالت ویرایش مدیر می‌توانید استعدادهای جدید اضافه کنید.</div>`;

function hdStand(){const m={};S.hdt.forEach(t=>{m[t.n]={n:t.n,w:0,d:0,l:0,gf:0,ga:0}});S.hdg.forEach(g=>{if(!hdOk(g))return;const a=m[g.a],b=m[g.b];if(!a||!b)return;const x=+g.sa,y=+g.sb;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;if(x>y){a.w++;b.l++}else if(x<y){b.w++;a.l++}else{a.d++;b.d++}});return Object.values(m).map(t=>({...t,p:t.w+t.d+t.l,pts:t.w*3+t.d,gd:t.gf-t.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)}

return `<article class="mc"><div class="mtop"><span class="bd ${res?"done":"soon"}">${res?"پایان یافته":"برگزار نشده"}</span><span class="mmeta">${meta.join(" · ")}</span></div><div class="mbody">${tm(g.a,res&&x>y,res&&y>x)}${res?`<div class="score"><b>${f(x)}</b><i>:</i><b>${f(y)}</b></div>`:`<div class="score dash">VS</div>`}${tm(g.b,res&&y>x,res&&x>y)}</div>${res&&g.bp?`<div class="mfoot"><span class="pl2">بهترین بازیکن میدان: ${esc(g.bp)}${g.bt?" ("+esc(g.bt)+")":""}</span></div>`:""}</article>`}).join("")).join("")}
