const MOD=[{"t":"پرس بالا و ضدپرس (Gegenpressing)","d":"به‌محض از دست رفتن توپ، چند ثانیه فشار شدید برای پس‌گرفتن آن در همان منطقه. توپ نزدیک دروازه حریف پس گرفته می‌شود و فرصت گل می‌سازد.","tip":"بعد از از دست رفتن توپ، نزدیک‌ترین سه نفر به توپ فشار می‌آورند و بقیه مسیر پاس را می‌بندند."},{"t":"ساخت بازی از عقب (Build-up)","d":"دروازه‌بان و مدافعان با پاس کوتاه توپ را از خط اول پرس عبور می‌دهند. هدف ساختن مثلث و پیدا کردن «مرد آزاد» است.","tip":"دو مدافع میانی را عریض بگذارید و هافبک دفاعی را بین آن‌ها پایین بیاورید."},{"t":"بازی موقعیتی (Positional Play)","d":"زمین به منطقه‌ها تقسیم می‌شود و هر بازیکن با جاگیری درست، برتری عددی یا کیفی می‌سازد. بازیکن بدون توپ هم تصمیم می‌گیرد.","tip":"در تمرین، قانون «هر پاس یک مرد آزاد می‌سازد» را اجرا کنید."},{"t":"نیم‌فضاها (Half-spaces)","d":"کانال‌های بین کنار و مرکز زمین. بازیکن در این فضا بین خط‌های حریف می‌ایستد و مدافع نمی‌داند چه کسی را بگیرد.","tip":"هافبک هجومی را در نیم‌فضا بگذارید و وینگر را عریض نگه دارید."},{"t":"انتقال‌ها (Transitions)","d":"پنج ثانیه بعد از گرفتن یا از دست دادن توپ. بخش مهمی از گل‌ها در همین لحظه‌ها زده می‌شود.","tip":"با تمرین «۶ نفر در برابر ۴ نفر» ضدحمله سریع را تمرین کنید."},{"t":"بلوک دفاعی (بالا، میانی، پایین)","d":"ارتفاع خط دفاع و فاصله بین خطوط. بلوک بالا توپ را زود می‌گیرد، بلوک پایین فضا را می‌بندد.","tip":"فاصله بین دفاع و حمله را حداکثر ۳۵ متر نگه دارید تا تیم فشرده بماند."},{"t":"نقش‌های ترکیبی","d":"فول‌بک وارونه به میانه می‌آید و مهاجم کاذب عقب می‌رود تا مدافع را از جایش بکشد. بازیکنان چندکاره، سیستم را در حین بازی عوض می‌کنند.","tip":"به هر بازیکن دو نقش یاد بدهید تا مربی بتواند ساختار را عوض کند."},{"t":"توپ‌های ثابت","d":"کرنر، ضربه آزاد و پرتاب اوت با طرح‌های تمرین‌شده؛ بخش مهمی از گل‌های هر دوره از همین‌هاست.","tip":"سه طرح کرنر و دو طرح ضربه آزاد ثابت داشته باشید و بارها تمرین کنید."},{"t":"دروازه‌بان به‌عنوان بازیکن میدان","d":"دروازه‌بان مدرن با پا بازی می‌کند، در ساخت بازی شرکت دارد و پشت خط دفاعی بالا را پوشش می‌دهد.","tip":"تمرین پاس بلند و کوتاه با پا را در برنامه دروازه‌بان بگذارید."},{"t":"تحلیل داده و ویدیو","d":"شمارش گل، پاس گل، کارت و نقشه عملکرد بازیکن‌ها؛ تحلیل ویدیویی نقاط ضعف و قوت را نشان می‌دهد. همین بخش آمار اپ شروع این مسیر است.","tip":"بعد از هر بازی ده دقیقه آمار و ویدیوی بازی را با بازیکنان مرور کنید."},{"t":"آمادگی بدنی و پیشگیری از مصدومیت","d":"دوره‌بندی تمرین، کنترل بار تمرینی و ریکاوری باعث می‌شود بازیکنان در ۹۰ دقیقه افت نکنند و کمتر مصدوم شوند.","tip":"یک روز قبل و بعد از بازی، تمرین سبک و کششی بگذارید."},{"t":"روان‌شناسی و رهبری","d":"انگیزه، اعتماد به نفس، سخنرانی نیمه‌وقت و فرهنگ تیم همان‌قدر مهم‌اند که تاکتیک. کاپیتان واسطه مربی در زمین است.","tip":"به‌جای سرزنش، بعد از اشتباه بازیکن راه‌حل را با او مرور کنید."}];

 if(cm=="mod")return `<h2>مربی‌گری مدرن</h2><p class="lead">مفاهیمی که فوتبال امروز را می‌سازند، با نکته‌ای برای مربی.</p>${seg}`+MOD.map((m,i)=>`<article class="spc m"><div class="mh"><span class="rk">${f(i+1)}</span><h3>${esc(m.t)}</h3></div><p>${esc(m.d)}</p><div class="hl">نکته مربی: ${esc(m.tip)}</div></article>`).join("")+`<article class="spc m"><h3>الگوی یک جلسه تمرین مدرن</h3><ol class="tl">${SES.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></article>`;

function talView(){const mo={};BEST.forEach(b=>{const i=b.n+"|"+b.t;mo[i]=(mo[i]||0)+1});const cd={};cplist().forEach(c=>{cd[c.n+"|"+c.t]=c});
 const rows=plist().map(p=>{const i=p.n+"|"+p.t,c=cd[i]||{y:0,r:0},m=mo[i]||0;return {n:p.n,t:p.t,g:p.g,a:p.a,m,sc:p.g*3+p.a*2+m*4-c.r*2-c.y*.5}});
 BEST.forEach(b=>{if(!rows.some(r=>r.n==b.n&&r.t==b.t)){const m=mo[b.n+"|"+b.t];rows.push({n:b.n,t:b.t,g:0,a:0,m,sc:m*4})}});
 rows.sort((a,b)=>b.sc-a.sc);const top=rows.slice(0,10),mx=top.length?Math.max(1,top[0].sc):1;
 const ph=(n,t)=>{const b=BEST.find(x=>x.n==n&&x.t==t);return b?`<img class="ph s2" src="${IM.best[b.p]}" alt="">`:tlg(t)};
 let h=`<h2>استعدادها</h2><p class="lead">ستاره‌های در حال ظهور جام، بر اساس عملکرد در میدان.</p><div class="crit"><span>گل ×۳</span><span>پاس گل ×۲</span><span>بهترین بازیکن ×۴</span><span>کارت قرمز −۲</span><span>کارت زرد −۰٫۵</span></div>`;
 h+=top.length?`<div class="pl">${top.map((x,i)=>`<div class="tr"><span class="rk">${f(i+1)}</span>${ph(x.n,x.t)}<div class="pn"><b>${esc(x.n)}</b><small>${esc(x.t)}</small><div class="mt2"><i style="width:${Math.max(6,Math.round(Math.max(0,x.sc)/mx*100))}%"></i></div></div><div class="tst"><span>${f(x.g)}<small>گل</small></span><span>${f(x.a)}<small>پاس</small></span><span>${f(x.m)}<small>★</small></span></div></div>`).join("")}</div>`:`<div class="empty">هنوز آماری ثبت نشده است.</div>`;
 h+=`<h2>گزارش استعدادیابی</h2>`;
 h+=S.talents.length?S.talents.map(x=>`<article class="spc m"><div class="mh">${tlg(x.t)}<div><h3>${esc(x.n||"بدون نام")}</h3><div class="mu">${esc(x.t)}${x.pos?" · "+esc(x.pos):""}</div></div></div>${x.note?`<p>${esc(x.note)}</p>`:""}</article>`).join(""):`<div class="empty">هنوز گزارشی ثبت نشده است. در حالت ویرایش مدیر می‌توانید استعدادهای جدید اضافه کنید.</div>`;
 return h}

function eachEv(fn){for(const k in RP){const [w,i]=k.split("-"),g=FX[w-1][i],r=RP[k];[["h",g[0]],["a",g[1]]].forEach(([s,t])=>{const e=r[s]||{};["g","a","c"].forEach(kd=>(e[kd]||[]).forEach(x=>fn(t,x,kd)))})}}
function plist(){const m={};const add=(n,t,k,v)=>{const id=n+"|"+t;m[id]=m[id]||{n,t,g:0,a:0};m[id][k]+=v};
 eachEv((t,x,kd)=>{if(kd=="g"&&!x[2])add(x[0],t,"g",x[1]);if(kd=="a")add(x[0],t,"a",x[1])});

function cplist(){const m={};eachEv((t,x,kd)=>{if(kd!="c")return;const id=x[0]+"|"+t;m[id]=m[id]||{n:x[0],t,y:0,r:0};const c=x[1];m[id].y+=c=="yyr"?2:c=="y"||c=="yr"?1:0;m[id].r+=c.includes("r")?1:0});return Object.values(m)}
